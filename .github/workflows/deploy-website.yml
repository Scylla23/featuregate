name: Deploy Website to VM

on:
  push:
    branches: [main]
    paths:
      - 'packages/website/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

env:
  VM_HOST: 129.153.16.254
  VM_USER: ubuntu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm -F @featuregate/website build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key pinned rather than scanned — TOFU in CI is a MITM window.
          echo "129.153.16.254 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAK+kmpwpoUlmCzRN7zvWObmZ+8WEbVj85fo/vfo5JSe" > ~/.ssh/known_hosts

      - name: Deploy website
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            packages/website/dist/ \
            $VM_USER@$VM_HOST:/var/www/featuregate/website/

      - name: Health check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://featuregate.online/)
          if [ "$code" != "200" ]; then echo "site returned $code"; exit 1; fi
          echo "website healthy"
